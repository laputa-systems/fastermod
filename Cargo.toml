[workspace]
members = [".", "imara-histogram-diff"]
resolver = "3"

[package]
name = "fastermod"
version = "0.0.1"
edition = "2024"
description = "A fast partial replacement for codemod"
license = "MIT OR Apache-2.0"

[dependencies]
ast-grep-core = "0.51"
ast-grep-language = "0.51"
grep = "0.4"
ignore = "0.4.1"
imara-histogram-diff = { path = "imara-histogram-diff" }
lexopt = "0.3.2"
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_semantic = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"
regex-lite = "0.1.9"
serde_json = "1"
toml_edit = "0.22"
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-r = "1.3.0"
tree-sitter-julia = "0.23.1"
tree-sitter-objc = "3.0.2"
tree-sitter-erlang = "0.21.0"
tree-sitter-ocaml = "0.26.0"
tree-sitter-fsharp = "0.3.12"
tree-sitter-groovy = "0.1.2"
tree-sitter-fortran = "0.6.0"
tree-sitter-matlab = "1.3.3"
tree-sitter-vb-dotnet = "0.1.0"

tree-sitter-toml-updated = "0.20.0"
tree-sitter-scss = "1.0.0"
tree-sitter-postgres = "19.0.0-beta.4.1"

[dev-dependencies]
rustybench = "0.5"

[[bench]]
name = "bench"
harness = false

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "termios"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
