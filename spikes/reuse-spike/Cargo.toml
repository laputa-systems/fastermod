[package]
name = "reuse-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Detached from the fastermod workspace: this is REFAC-5 evidence code, not
# shipped code. `cargo` ignores it for `cargo build --workspace`.
[workspace]

# .cargo/config.toml next to this manifest re-points crates-io at the real
# index: the repo-level config replaces it with a partial mirror that does
# not carry parser crates.

[dependencies]
tree-sitter = { version = "0.27" }
tree-sitter-rust = { version = "0.24" }
tree-sitter-python = { version = "0.25" }
tree-sitter-javascript = { version = "0.25" }
tree-sitter-typescript = { version = "0.23" }
ast-grep-core = { version = "0.51" }
ast-grep-language = { version = "0.51" }
oxc_allocator = { version = "0.158" }
oxc_ast = { version = "0.158" }
oxc_parser = { version = "0.158" }
oxc_semantic = { version = "0.158" }
oxc_span = { version = "0.158" }
